apiVersion: batch/v1
kind: CronJob

metadata:
  name: airw-test-cronjob
  namespace: airw

spec:
  schedule: "* * * * *"
  
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never

          containers:
            - name: test-cronjob
              image: busybox:1.36
              command: ["sh", "-c", "echo \"Hello from CronJob! Time: $(date)\""]